name: CI

on:
  pull_request:

jobs:
  web:
    name: Web (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:web

      - name: Unit, route, and database policy tests
        run: npm run test:unit

  mobile:
    name: Mobile (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      # Shared TypeScript sources resolve dependencies from the repository root.
      - name: Install shared and lint tooling dependencies
        run: npm ci

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Dependency compatibility contracts
        working-directory: apps/mobile
        run: npm run test:dependencies

      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Lint
        working-directory: apps/mobile
        run: npm run lint
